<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>טבלאות Northwind בקצרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one compact sheet, a grid of small table cards (field name + type only). */
:root {
  --bg: #EEF1F5;
  --page: #FCFCFD;
  --ink: #172033;
  --muted: #556074;
  --line: #D6DBE3;
  --head: #E4E9F1;
  --accent: #2457C5;
  --font-display: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --page: #161D29; --ink: #E7EBF2; --muted: #9AA5B8; --line: #2B3546; --head: #1F2836; --accent: #84A9FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --page: #161D29; --ink: #E7EBF2; --muted: #9AA5B8; --line: #2B3546; --head: #1F2836; --accent: #84A9FF; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 14px; line-height: 1.45; }
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3vw, 34px); margin: 0; text-align: right; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; direction: ltr; }
.card { background: var(--page); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.card h2 { margin: 0; padding: 9px 12px; background: var(--head); font-family: var(--font-mono); font-weight: 600; font-size: 16px; color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
td { padding: 4px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
td:first-child { font-weight: 600; }
td:last-child { color: var(--muted); text-align: right; }
@media (max-width: 1050px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 780px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
<style>
/* Back link to the page's topic in index.html */
.site-back{color:var(--accent);font-family:var(--font-body,"Assistant","Arial Hebrew",Arial,sans-serif);font-weight:600;font-size:15px;text-decoration:none;width:fit-content;white-space:nowrap}
.site-back:hover,.site-back:focus-visible{text-decoration:underline}
.wrap > .site-back{display:block;margin-bottom:12px}
@media print{.site-back{display:none}}
</style>
<script src="font-size.js"></script>
</head>
<body>
<div class="wrap">
  <a class="site-back" dir="rtl" style="align-self:flex-start" href="index.html#database">→ חזרה לנושא: מסד הנתונים Northwind</a>
  <h1 dir="rtl">טבלאות Northwind <span style="font-family:var(--font-mono);font-weight:400;font-size:.55em;color:var(--muted)">· sql-practice.com · northwind.db</span></h1>
  <div class="grid" id="grid"></div>
</div>

<script>
const T = [
  ["customers", ["customer_id TEXT", "company_name TEXT", "contact_name TEXT", "contact_title TEXT", "address TEXT", "city TEXT", "region TEXT", "postal_code TEXT", "country TEXT", "phone TEXT", "fax TEXT"]],
  ["orders", ["order_id INTEGER", "customer_id TEXT", "employee_id INTEGER", "order_date DATETIME", "required_date DATETIME", "shipped_date DATETIME", "ship_via INTEGER", "freight NUMERIC", "ship_name TEXT", "ship_address TEXT", "ship_city TEXT", "ship_region TEXT", "ship_postal_code TEXT", "ship_country TEXT"]],
  ["order_details", ["order_id INT", "product_id INT", "quantity INT", "discount REAL"]],
  ["products", ["product_id INTEGER", "product_name TEXT", "supplier_id INTEGER", "category_id INTEGER", "quantity_per_unit TEXT", "unit_price NUMERIC", "units_in_stock INTEGER", "units_on_order INTEGER", "reorder_level INTEGER", "discontinued INTEGER"]],
  ["categories", ["category_id INTEGER", "category_name TEXT", "description TEXT"]],
  ["shippers", ["shipper_id INTEGER", "company_name TEXT", "phone TEXT"]],
  ["suppliers", ["supplier_id INTEGER", "company_name TEXT", "contact_name TEXT", "contact_title TEXT", "address TEXT", "city TEXT", "region TEXT", "postal_code TEXT", "country TEXT", "phone TEXT", "fax TEXT", "home_page TEXT"]],
  ["employees", ["employee_id INTEGER", "last_name TEXT", "first_name TEXT", "title TEXT", "title_of_courtesy TEXT", "birth_date DATE", "hire_date DATE", "address TEXT", "city TEXT", "region TEXT", "postal_code TEXT", "country TEXT", "home_phone TEXT", "extension TEXT", "reports_to INTEGER"]],
  ["employee_territories", ["employee_id INTEGER", "territory_id TEXT"]],
  ["territories", ["territory_id TEXT", "territory_description TEXT", "region_id INTEGER"]],
  ["regions", ["region_id INTEGER", "region_description TEXT"]],
];
document.getElementById("grid").innerHTML = T.map(([name, cols]) =>
  `<section class="card"><h2>${name}</h2><table>${cols.map(c => {
    const [f, t] = c.split(" ");
    return `<tr><td>${f}</td><td>${t}</td></tr>`;
  }).join("")}</table></section>`).join("");
</script>
</body>
</html>
