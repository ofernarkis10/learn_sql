<style>

h1{font-size:2.6rem}
h2{font-size:1.6rem;color:var(--accent)}

/* Search */
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;margin-block:-10px}
.search label{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 16px}
.search label:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .ico{color:var(--muted);font-size:1.1rem;padding-inline-start:4px}

#view{display:flex;flex-direction:column;gap:32px}
.group{display:flex;flex-direction:column;gap:10px}

.group h2 a{font-family:var(--f-body);font-size:.9rem;font-weight:700;color:var(--accent);text-decoration:none}
.group h2 a:hover,.group h2 a:focus-visible{text-decoration:underline}
.note{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--muted);font-size:.97rem}

a.pathcard{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-inline-start:6px solid var(--mark);border-radius:12px;padding:18px 22px;color:inherit;text-decoration:none;transition:border-color .15s}
a.pathcard:hover,a.pathcard:focus-visible{border-color:var(--mark);outline:none}

a.pathcard ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 8px;counter-reset:st}
a.pathcard ol li{counter-increment:st;font-size:.9rem;font-weight:700;color:var(--mark);background:var(--accent-soft);border-radius:99px;padding:2px 12px}
a.pathcard ol li::before{content:counter(st) ". "}
a.pathcard .go{color:var(--accent);font-weight:700;font-size:.92rem}
section.step{display:flex;flex-direction:column;gap:12px}
section.step h2{display:flex;align-items:baseline;gap:12px}
section.step h2 .sn{font-family:var(--f-mono);color:var(--paper);background:var(--accent);border-radius:99px;min-width:2.2rem;text-align:center;font-size:1.1rem;padding:0 8px}
section.step .st{color:var(--muted);max-width:70ch}
.from{font-size:.78rem;color:var(--muted);font-weight:600}
.hwtag{font-size:.75rem;font-weight:700;color:var(--paper);background:var(--mark);border-radius:99px;padding:1px 8px;margin-inline-start:8px;vertical-align:middle;font-family:var(--f-body)}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const titleOf = id => byId[id].title;

/* ---------- search: ignore niqqud, geresh/gershayim/quotes, maqaf and case ---------- */
function norm(s){
  let out = '', map = [];
  for (let i = 0; i < s.length; i++){
    let c = s[i];
    if (c === '־' || c === '-' || c === '_') c = ' ';
    else if (/[֑-ׇ'"׳״`‘’“”]/.test(c)) continue;
    out += c.toLowerCase(); map.push(i);
  }
  return { out, map };
}
const terms = q => norm(q).out.split(/\s+/).filter(Boolean);
const plain = html => html.replace(/<[^>]+>/g, '');
function matches(item, topic, ts){
  const hay = norm(item.t + ' ' + plain(item.d) + ' ' + topic.title + (item.homework ? ' שיעורי בית עבודת בית' : '')).out;
  return ts.every(t => hay.includes(t));
}
// highlight the terms in a plain-text string (returns escaped HTML)
function hl(text, ts){
  if (!ts.length) return esc(text);
  const { out, map } = norm(text), r = [];
  for (const t of ts){ let p = out.indexOf(t); while (p !== -1){ r.push([map[p], map[p + t.length - 1] + 1]); p = out.indexOf(t, p + 1); } }
  if (!r.length) return esc(text);
  r.sort((a, b) => a[0] - b[0]);
  const m = [r[0]]; for (const x of r.slice(1)){ const l = m[m.length - 1]; if (x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else m.push(x); }
  let html = '', at = 0;
  for (const [a, b] of m){ html += esc(text.slice(at, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; at = b; }
  return html + esc(text.slice(at));
}
// description: highlight the text and the text inside <code>, keep the tags
const hlDesc = (d, ts) => d.split(/(<\/?code>)/).map((p, k) => k % 2 ? p : hl(p, ts)).join('');

/* ---------- rendering ---------- */
function itemHTML(i, ts = [], no = i.no, from = ''){
  const ext = /\.pdf$/i.test(i.href) ? ' target="_blank" rel="noopener"' : '';

  return `<li><a href="${esc(i.href)}"${ext}><span class="no">${no}</span><span class="t">${hl(i.t, ts)}${tag}${from ? ` <span class="from">· ${from}</span>` : ''}</span><span class="q">${esc(i.q)}</span><span class="d">${hlDesc(i.d, ts)}</span></a></li>`;
}
const header = (title, lead, count) => `<header>

function topicNav(id){

}
const card = t => `<li><a href="#${t.id}"><span class="tt">${t.title}</span><span class="tc">${t.count}</span><span class="td">${t.desc}</span><span class="go">לדפי הנושא ←</span></a></li>`;

function renderTopic(t){

// documents by file name, with their topic, for the learning path
const byHref = Object.fromEntries(TOPICS.flatMap(t => t.items.map(i => [i.href, { item: i, topic: t }])));
function renderPath(){
  const steps = PATH.steps.map((s, k) => {

function renderSearch(q){
  const ts = terms(q);
  let total = 0;
  const groups = TOPICS.map(t => {
    const hits = t.items.filter(i => matches(i, t, ts));
    total += hits.length;
    return hits.length ? `<section class="group">
  <h2>${t.title} <a href="#${t.id}">לדף הנושא ←</a></h2>
  <ul class="docs">
${hits.map(i => itemHTML(i, ts)).join('\n')}
  </ul>
</section>` : '';
  }).join('\n');
  const summary = total ? `נמצאו ${total} דפים עבור "${esc(q.trim())}"` : `לא נמצאו דפים עבור "${esc(q.trim())}". נסו מילה אחרת או חלק ממילה.`;
  return `<a class="back" href="#">→ לכל הנושאים</a>
${header('תוצאות חיפוש', '', '')}
<p class="note" role="status">${summary}</p>
${groups}`;
}

/* ---------- routing by the URL hash ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('q=')) return { kind: 'search', q: h.slice(2) };
  if (h === 'path') return { kind: 'path' };
  if (byId[h]) return { kind: 'topic', id: h };
  return { kind: 'home' };
}
let lastNonSearch = '';
function render(scroll){
  const r = route();
  if (r.kind === 'search' && !r.q.trim()){ history.replaceState(null, '', lastNonSearch || location.pathname); return render(scroll); }
  if (r.kind !== 'search'){ lastNonSearch = location.hash || ''; if (document.activeElement !== qInput) qInput.value = ''; }
  else if (qInput.value !== r.q) qInput.value = r.q;
  clearBtn.hidden = !qInput.value;
  view.innerHTML = r.kind === 'search' ? renderSearch(r.q) : r.kind === 'path' ? renderPath() : r.kind === 'topic' ? renderTopic(byId[r.id]) : renderHome();
  document.title = r.kind === 'home' ? 'לומדים SQL · Northwind' : r.kind === 'search' ? `חיפוש: ${r.q.trim()} · ${SITE}` : r.kind === 'path' ? `${PATH.title} · ${SITE}` : `${titleOf(r.id)} · ${SITE}`;
  if (scroll) window.scrollTo(0, 0);
}
qInput.addEventListener('input', () => {
  const v = qInput.value;
  const inSearch = route().kind === 'search';
  if (v.trim()){
    const url = '#q=' + encodeURIComponent(v);
    inSearch ? history.replaceState(null, '', url) : history.pushState(null, '', url);
  } else {
    history.replaceState(null, '', lastNonSearch || location.pathname);
  }
  render(false);
});
qInput.addEventListener('keydown', e => { if (e.key === 'Escape'){ qInput.value = ''; qInput.dispatchEvent(new Event('input')); } });
clearBtn.addEventListener('click', () => { qInput.value = ''; qInput.dispatchEvent(new Event('input')); qInput.focus(); });
window.addEventListener('hashchange', () => render(true));
window.addEventListener('popstate', () => render(true));
render(false);
</script>
</body>
</html>
