<style>
/* Layout: one page at a time on a projector (question, then answer), or all pages stacked as a document. */
:root {
  --bg: #EEF1F5;
  --page: #FCFCFD;
  --ink: #172033;
  --muted: #556074;
  --line: #D6DBE3;
  --soft: #E4E9F1;
  --accent: #2457C5;
  --answer: #A34E16;
  --answer-soft: #F7E9DE;
  --code-bg: #172033;
  --code-fg: #E6E9EF;
  --code-kw: #8FB4FF;
  --code-fn: #F0A9DA;
  --code-str: #F2C08A;
  --code-num: #9EDFC0;
  --font-display: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", Arial, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --page: #161D29; --ink: #E7EBF2; --muted: #9AA5B8; --line: #2B3546; --soft: #1F2836;
    --accent: #84A9FF; --answer: #F0A066; --answer-soft: #2E241C;
    --code-bg: #0A0F17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --page: #161D29; --ink: #E7EBF2; --muted: #9AA5B8; --line: #2B3546; --soft: #1F2836;
  --accent: #84A9FF; --answer: #F0A066; --answer-soft: #2E241C;
  --code-bg: #0A0F17; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.55;
  display: flex; flex-direction: column;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
* { box-sizing: border-box; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--page); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 500; }
.spacer { flex: 1; }
.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, .btn {
  background: var(--page); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 12px; min-height: 38px; cursor: pointer;
}
.btn:hover, select:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; min-height: 36px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--page); }
.progress { max-width: 1240px; margin: 8px auto 0; display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; }
.progress i { height: 5px; border-radius: 3px; background: var(--soft); cursor: pointer; }
.progress i.done { background: color-mix(in srgb, var(--accent) 45%, var(--soft)); }
.progress i.now { background: var(--accent); }

/* stage */
main {
  flex: 1; min-height: 0; overflow: auto;
  padding-block: 20px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.deck { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.pg {
  background: var(--page); border: 1px solid var(--line); border-radius: 14px;
  padding: clamp(20px, 3.4vw, 48px); min-height: min(640px, calc(100vh - 210px));
  display: flex; flex-direction: column; gap: 22px; position: relative;
}
body.slides .pg { display: none; }
body.slides .pg.on { display: flex; }
.pg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
.pg.ans .eyebrow { color: var(--answer); }
.pgno { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* question page */
.qbody { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; max-width: 980px; }
.qnum { font-family: var(--font-display); font-weight: 700; font-size: clamp(56px, 9vw, 112px); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.qtext { font-family: var(--font-display); font-weight: 500; font-size: clamp(26px, 3.6vw, 46px); line-height: 1.3; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--muted); font-size: 17px; }
.chip { font-family: var(--font-mono); font-size: 15px; background: var(--soft); border-radius: 6px; padding: 3px 10px; color: var(--ink); direction: ltr; }
.hint-btn { align-self: flex-start; }
.hint { background: var(--soft); border-radius: 10px; padding: 14px 18px; font-size: 19px; max-width: 760px; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--soft); padding: 1px 6px; border-radius: 4px; direction: ltr; unicode-bidi: isolate; }

/* answer page */
.atitle { font-family: var(--font-display); font-weight: 500; font-size: clamp(21px, 2.3vw, 28px); line-height: 1.35; text-wrap: balance; max-width: 1000px; }
.agrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.lbl { font-size: 14px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }
pre.sql {
  margin: 0; direction: ltr; text-align: left; background: var(--code-bg); color: var(--code-fg);
  border-radius: 10px; padding: 18px 20px; overflow-x: auto;
  font-family: var(--font-mono); font-size: clamp(13px, 1.2vw, 16px); line-height: 1.55;
}
.kw { color: var(--code-kw); font-weight: 600; }
.fn { color: var(--code-fn); }
.str { color: var(--code-str); }
.num { color: var(--code-num); }
.res { overflow-x: auto; direction: ltr; border: 1px solid var(--line); border-radius: 10px; }
.res table { border-collapse: collapse; width: 100%; font-size: 16px; font-variant-numeric: tabular-nums; }
.res th, .res td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.res th { background: var(--soft); font-weight: 700; font-family: var(--font-mono); font-size: 14px; }
.res td.n, .res th.n { text-align: right; }
.res tr:last-child td { border-bottom: 0; }
.res .more td { color: var(--muted); font-style: italic; text-align: left; }
.rowcount { font-size: 15px; color: var(--muted); }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
ol.steps li::before {
  content: counter(s); font-family: var(--font-display); font-weight: 700; font-size: 15px;
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--answer-soft); color: var(--answer);
}
.note { background: var(--answer-soft); border-radius: 10px; padding: 14px 18px; font-size: 17px; }
.note b { color: var(--answer); }

/* cover */
.cover h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 5.5vw, 68px); line-height: 1.1; margin: 0; text-wrap: balance; }
.cover .sub { font-size: clamp(19px, 2vw, 24px); color: var(--muted); max-width: 820px; margin: 0; }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stage { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; background: var(--page); text-align: right; }
.stage:hover { border-color: var(--accent); }
.stage .r { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage .t { font-family: var(--font-display); font-weight: 500; font-size: 18px; line-height: 1.3; }
.tables { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; direction: ltr; }
.tables div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.tables b { display: block; color: var(--ink); font-size: 15px; }
.fx { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fx div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fx b { font-size: 15px; }
.fx code { background: none; padding: 0; font-size: 13px; text-align: left; overflow-wrap: anywhere; color: var(--ink); }
.fx span { font-size: 14px; color: var(--muted); line-height: 1.4; }
.cm { color: var(--muted); font-style: italic; unicode-bidi: isolate; }
pre.sql { font-size: clamp(12px, 1.05vw, 15px); }

/* bottom nav */
.nav {
  background: var(--page); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.doc .nav { display: none; }
body.doc main { overflow: visible; }
body.doc { height: auto; }
.nav-in { max-width: 1240px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.nav .btn { min-width: 120px; font-weight: 600; }
.nav .btn.primary { background: var(--accent); color: var(--page); border-color: var(--accent); }
.nav .where { color: var(--muted); font-size: 16px; text-align: center; }
.keys { font-size: 14px; color: var(--muted); }

@media (max-width: 900px) {
  .agrid { grid-template-columns: minmax(0, 1fr); }
  .stages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tables { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fx { grid-template-columns: minmax(0, 1fr); }
  .keys { display: none; }
}
@media (max-width: 520px) {
  .nav .btn { min-width: 0; }
  .brand span { display: none; }
}
@media print {
  .bar, .nav { display: none !important; }
  body.slides .pg, .pg { display: flex !important; break-after: page; border: 0; min-height: 0; }
  main { overflow: visible; }
}
@media (prefers-reduced-motion: no-preference) {
  body.slides .pg.on { animation: in .18s ease-out; }
  @keyframes in { from { opacity: .4; } to { opacity: 1; } }
}
</style>

.site-back{color:var(--accent);font-family:var(--font-body,"Assistant","Arial Hebrew",Arial,sans-serif);font-weight:600;font-size:15px;text-decoration:none;width:fit-content;white-space:nowrap}
.site-back:hover,.site-back:focus-visible{text-decoration:underline}
.wrap > .site-back{display:block;margin-bottom:12px}

<script>
const STAGES = [
  { r: [1, 4], t: "מדדי מרכז" },
  { r: [5, 8], t: "מדדי פיזור" },
  { r: [9, 13], t: "כמה ההתפלגות נורמלית?" },
  { r: [14, 16], t: "רגרסיה לינארית" },
  { r: [17, 20], t: "אתגר: טבלת עזר עם GROUP BY" },
];

const Q = [
{
"q": "מה המחיר הממוצע של מוצר, ומה המחיר החציוני? מה ההבדל ביניהם אומר על ההתפלגות של המחירים?",
"tables": [
"products"
],
"hint": "באתר יש פונקציה MEDIAN שמחזירה את החציון, בדיוק כמו ש־AVG מחזירה את הממוצע.",
"cols": [
"mean_price",
"median_price"
],
"num": [

[
"28.8664",
"19"
]
],
"steps": [
"<code>AVG(unit_price)</code> מחשב את הממוצע של 77 המחירים: 28.87.",
"<code>MEDIAN(unit_price)</code> ממיין את המחירים ומחזיר את הערך האמצעי: 19. מחצית מהמוצרים זולים מ־19, ומחציתם יקרים יותר.",
"הממוצע גבוה מהחציון בכמעט 10. כמה מוצרים יקרים מאוד, למשל Côte de Blaye ב־263.5, מושכים את הממוצע למעלה, אבל כמעט לא משנים את החציון.",
"כשהממוצע גדול מהחציון, ההתפלגות <b>אסימטרית ימנית</b>: רוב המחירים נמוכים, ויש זנב ארוך של מחירים גבוהים."
],
"note": "<b>מושג:</b> החציון עמיד לערכים קיצוניים, והממוצע לא. <br><b>באקסל:</b> <code>AVERAGE</code> ו־<code>MEDIAN</code>.",
"sql": "SELECT AVG(unit_price) AS mean_price,\n       MEDIAN(unit_price) AS median_price\nFROM products;"
},
{
"q": "מהם הממוצע, החציון והשכיח של הכמות (quantity) בשורת הזמנה?",
"tables": [
"order_details"
],
"hint": "הפונקציה MODE מחזירה את הערך שמופיע הכי הרבה פעמים.",
"cols": [
"mean_qty",
"median_qty",
"mode_qty"
],
"num": [
0,
1,
2
],
"rows": [
[
"23.813",
"20",
"20"
]
],
"steps": [
"<code>AVG(quantity)</code>: בממוצע מזמינים 23.81 יחידות בשורה.",
"<code>MEDIAN(quantity)</code>: בחצי מ־2,155 השורות מזמינים 20 יחידות או פחות.",
"<code>MODE(quantity)</code>: הכמות הנפוצה ביותר היא 20.",
"החציון והשכיח שווים, והממוצע גדול מהם. יש שורות עם כמויות גדולות, עד 130 יחידות, והן מושכות את הממוצע למעלה.",

],
"note": "<b>באקסל:</b> <code>MODE.SNGL</code>. <br><b>שימו לב:</b> שלושת המדדים קרובים זה לזה, ולכן כאן הצידוד מתון. בשאלה 11 נמדוד אותו.",
"sql": "SELECT AVG(quantity) AS mean_qty,\n       MEDIAN(quantity) AS median_qty,\n       MODE(quantity) AS mode_qty\nFROM order_details;"
},
{
"q": "מהו המחיר השכיח של מוצר? נסו קודם את MODE(unit_price). אם התוצאה ריקה, מצאו את השכיח בעזרת GROUP BY.",
"tables": [
"products"
],
"hint": "סופרים כמה מוצרים יש בכל מחיר, וממיינים מהמחיר הנפוץ ביותר.",
"cols": [
"unit_price",
"n"
],
"num": [
0,
1
],
"rows": [
[

],
[

[

]
],
"steps": [
"<code>SELECT MODE(unit_price) FROM products</code> מחזירה באתר <code>NULL</code>, תא ריק. הסיבה: שני מחירים מופיעים הכי הרבה פעמים, ו־MODE לא בוחרת ביניהם.",
"<code>GROUP BY unit_price</code> יוצר קבוצה לכל מחיר, ו־<code>COUNT(*)</code> סופר כמה מוצרים יש בה.",
"<code>ORDER BY n DESC, unit_price</code> ממיין מהמחיר הנפוץ ביותר. כשיש תיקו, המחיר הנמוך מופיע ראשון.",
"<code>LIMIT 3</code> משאיר את שלושת המחירים הנפוצים.",
"התשובה: יש שני שכיחים, 14 ו־18, וכל אחד מהם מופיע אצל 4 מוצרים. התפלגות כזאת נקראת <b>דו־שכיחית</b>."

"note": "<b>באקסל:</b> <code>MODE.SNGL</code> מחזירה רק את השכיח הראשון שהיא פוגשת, ו־<code>MODE.MULT</code> מחזירה את כל השכיחים. <br><b>מסקנה:</b> כשיש מעט ערכים שחוזרים על עצמם, השכיח הוא מדד מרכז חלש.",

"sql": "WITH t AS (\n  SELECT SUBSTR(o.order_date, 1, 7) AS ym,\n         COUNT(DISTINCT o.order_id) AS x,\n         SUM(p.unit_price * od.quantity\n             * (1 - od.discount)) AS y\n  FROM orders AS o\n  JOIN order_details AS od ON od.order_id = o.order_id\n  JOIN products AS p ON p.product_id = od.product_id\n  WHERE o.order_date < '2018-05-01'\n  GROUP BY ym\n)\nSELECT COUNT(*) AS n,\n       (AVG(x * y) - AVG(x) * AVG(y))\n         / (AVG(x * x) - AVG(x) * AVG(x)) AS slope,\n       AVG(y) - (AVG(x * y) - AVG(x) * AVG(y))\n         / (AVG(x * x) - AVG(x) * AVG(x)) * AVG(x) AS intercept,\n       (AVG(x * y) - AVG(x) * AVG(y))\n         / SQRT((AVG(x * x) - AVG(x) * AVG(x))\n              * (AVG(y * y) - AVG(y) * AVG(y))) AS r\nFROM t;"
},
{
"q": "לכל מוצר מחשבים כמה יחידות נמכרו ממנו בסך הכול. האם ההתפלגות של הסכומים האלה קרובה לנורמלית?",
"tables": [
"order_details"
],
"hint": "טבלת העזר מחשבת SUM(quantity) לכל מוצר. על העמודה x שלה מחשבים ממוצע, חציון, סטיית תקן ומקדם צידוד, ואז בודקים את כלל 68–95–99.7.",
"cols": [
"pct_1sd",
"pct_2sd",
"pct_3sd"
],
"num": [
0,

2
],
"rows": [
[

]
],
"steps": [
"בטבלת העזר יש שורה לכל אחד מ־77 המוצרים, ו־<code>x</code> הוא סך היחידות שנמכרו ממנו.",
"<b>שלב 1:</b> ממוצע 666.45, חציון 697. הממוצע והחציון קרובים, והחציון גדול מעט.",
"מקדם הצידוד 0.28−: צידוד שמאלי קל. ההתפלגות כמעט סימטרית.",
"<b>שלב 2:</b> הגבולות: 666.45 ± 329.24 נותן 337.21 עד 995.69. 64.9% בטווח של סטיית תקן אחת, 96.1% בטווח של שתיים ו־100% בטווח של שלוש. כמעט בדיוק 68–95–99.7.",
"<b>מסקנה:</b> מכל הנתונים בדף, זו ההתפלגות הקרובה ביותר לנורמלית."
],
"note": "<b>סיכום מקדמי הצידוד בדף:</b> דמי משלוח 0.95 · ימי משלוח 0.65 · כמות בשורה 0.60 · לוג המחיר 0.29 · יחידות למוצר 0.28−. <br><b>שימו לב:</b> בשלב 2 חוזרים על ה־WITH, כי טבלת עזר קיימת רק בתוך השאילתה שלה.",
"sql": "-- שלב 1: סך היחידות לכל מוצר, ועליו המדדים\nWITH t AS (\n  SELECT product_id, SUM(quantity) AS x\n  FROM order_details\n  GROUP BY product_id\n)\nSELECT COUNT(*) AS n, AVG(x) AS mean_x,\n       MEDIAN(x) AS median_x, STDEV(x) AS sd_x,\n       3 * (AVG(x) - MEDIAN(x)) / STDEV(x) AS skew\nFROM t;\n\n-- שלב 2: ממוצע 666.45, סטיית תקן 329.24\nWITH t AS (\n  SELECT product_id, SUM(quantity) AS x\n  FROM order_details\n  GROUP BY product_id\n)\nSELECT\n  ROUND(100.0 * AVG(x BETWEEN 337.21 AND 995.69), 1)\n    AS pct_1sd,\n  ROUND(100.0 * AVG(x BETWEEN 7.97 AND 1324.93), 1)\n    AS pct_2sd,\n  ROUND(100.0 * AVG(x BETWEEN -321.27 AND 1654.17), 1)\n    AS pct_3sd\nFROM t;",

/* ---------- rendering ---------- */
const KW = new Set("SELECT FROM WHERE GROUP BY HAVING ORDER ASC DESC AS AND OR NOT NULL IS JOIN ON LIMIT DISTINCT IN LEFT INNER CAST WITH BETWEEN".split(" "));
const FN = new Set("COUNT SUM AVG MIN MAX YEAR MONTH ROUND TRIM MEDIAN MODE STDEV VARIANCE LOWER_QUARTILE UPPER_QUARTILE SQRT LOG EXP ABS SUBSTR POWER".split(" "));
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// comments: Hebrew text with numbers after it; keep the numeric tail left to right
function cmHtml(c) {
  const he = /[\u0590-\u05FF]/;
  for (let i = 0; i < c.length; i++) if (/[\d±]/.test(c[i]) && !he.test(c.slice(i))) return esc(c.slice(0, i)) + '<bdi dir="ltr">' + esc(c.slice(i)) + '</bdi>';
  return esc(c);
}
function hl(sql) {
  let out = "", last = 0;
  const re = /(--[^\n]*)|('[^']*')|(\[[^\]]+\])|\b(\d+(?:\.\d+)?)\b|\b([A-Z_]+|julianday)\b/g;
  let m;
  while ((m = re.exec(sql))) {
    out += esc(sql.slice(last, m.index));
    if (m[1]) out += `<span class="cm" dir="ltr">${cmHtml(m[1])}</span>`;
    else if (m[2]) out += `<span class="str">${esc(m[2])}</span>`;
    else if (m[3]) out += esc(m[3]);
    else if (m[4]) out += `<span class="num">${m[4]}</span>`;
    else if (KW.has(m[5])) out += `<span class="kw">${m[5]}</span>`;
    else if (FN.has(m[5]) || m[5] === "julianday") out += `<span class="fn">${m[5]}</span>`;
    else out += m[5];
    last = re.lastIndex;
  }
  return out + esc(sql.slice(last));
}
const stageOf = n => STAGES.findIndex(s => n >= s.r[0] && n <= s.r[1]);
const stageLabel = n => { const i = stageOf(n); return `שלב ${"אבגדה"[i]}: ${STAGES[i].t}`; };

function resultTable(d) {
  const num = new Set(d.num || []);
  const head = d.cols.map((c, i) => `<th class="${num.has(i) ? "n" : ""}">${esc(c)}</th>`).join("");
  const body = d.rows.map(r => `<tr>${r.map((v, i) => `<td class="${num.has(i) ? "n" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("");
  const more = d.more ? `<tr class="more"><td colspan="${d.cols.length}">… ועוד ${d.more} שורות</td></tr>` : "";
  const n = d.total || d.rows.length;
  return `<div class="res"><table>${head ? `<tr>${head}</tr>` : ""}${body}${more}</table></div>
          <div class="rowcount">${n === 1 ? "שורה אחת" : n + " שורות"} בתוצאה</div>`;
}

const pages = [];
const deck = document.getElementById("deck");

// cover
pages.push({ id: "start", label: "פתיחה", html: `
  <div class="pg-head"><div class="eyebrow">שיעור SQL · מגמת מידע ונתונים</div><div class="pgno">דף פתיחה</div></div>
  <div class="cover" style="display:flex;flex-direction:column;gap:22px">
    <h1>סטטיסטיקה ב־SQL: מדדים, התפלגות נורמלית ורגרסיה</h1>
    <p class="sub">20 תרגילים על הנתונים של Northwind באתר sql-practice.com (בסיס הנתונים northwind.db). כל תרגיל מוצג בשני דפים: קודם השאלה, ואז הפתרון עם התוצאה והסבר מפורט. כל השאילתות נבדקו באתר. האתר מציג מספרים עשרוניים עם יותר ספרות, וכאן הם מעוגלים.</p>
    <div class="lbl">חמשת השלבים</div>
    <div class="stages">${STAGES.map((s, i) => `<button type="button" class="stage" data-go="q${s.r[0]}"><span class="r">שאלות ${s.r[0]}–${s.r[1]}</span><span class="t">${esc(s.t)}</span></button>`).join("")}</div>
    <div class="lbl">הפונקציות והנוסחאות · <a href="https://claude.ai/artifact/HkN9TcwvV5YPCnr3uTC7TV" target="_blank" rel="noopener" style="color:var(--accent)">רשימת כל הטבלאות והשדות ↗</a></div>
    <div class="fx"><div><b>ממוצע · חציון · שכיח</b><code dir="ltr">AVG(x) · MEDIAN(x) · MODE(x)</code><span>MODE מחזירה NULL כשיש שני שכיחים</span></div><div><b>שונות · סטיית תקן (מדגם)</b><code dir="ltr">VARIANCE(x) · STDEV(x)</code><span>חלוקה ב־n − 1, כמו VAR.S ו־STDEV.S</span></div><div><b>שונות של אוכלוסייה</b><code dir="ltr">AVG(x * x) - AVG(x) * AVG(x)</code><span>חלוקה ב־n, כמו VAR.P. סטיית התקן: SQRT של זה</span></div><div><b>רבעונים</b><code dir="ltr">LOWER_QUARTILE(x) · UPPER_QUARTILE(x)</code><span>IQR = Q3 − Q1</span></div><div><b>פונקציות מתמטיות</b><code dir="ltr">SQRT · LOG · EXP · ABS · POWER</code><span>LOG הוא הלוגריתם הטבעי (ln)</span></div><div><b>מקדם צידוד של פירסון</b><code dir="ltr">3 * (AVG(x) - MEDIAN(x)) / STDEV(x)</code><span>קרוב ל־0: סימטרי. חיובי: צידוד ימני</span></div><div><b>אחוז השורות בטווח</b><code dir="ltr">100.0 * AVG(x BETWEEN a AND b)</code><span>תנאי שווה 1 כשהוא נכון ו־0 כשלא</span></div><div><b>כלל 68–95–99.7</b><code dir="ltr">x̄ ± 1s · x̄ ± 2s · x̄ ± 3s</code><span>בהתפלגות נורמלית: 68%, 95% ו־99.7% מהערכים</span></div><div><b>שיפוע b</b><code dir="ltr">(AVG(x*y) - AVG(x)*AVG(y)) / (AVG(x*x) - AVG(x)*AVG(x))</code><span>כמה y משתנה כש־x עולה ב־1</span></div><div><b>חותך a · קו הרגרסיה</b><code dir="ltr">AVG(y) - b * AVG(x)   ·   ŷ = a + b·x</code><span>הערך החזוי של y כש־x = 0</span></div><div><b>מקדם מתאם r</b><code dir="ltr">(AVG(x*y) - AVG(x)*AVG(y)) / SQRT((AVG(x*x) - AVG(x)*AVG(x)) * (AVG(y*y) - AVG(y)*AVG(y)))</code><span>בין 1− ל־1. R² = r · r</span></div><div><b>טבלת עזר</b><code dir="ltr">WITH t AS (SELECT ... AS x, ... AS y FROM ...) SELECT ... FROM t;</code><span>כך השאילתה הראשית זהה בכל שאלות הרגרסיה</span></div></div>
    <div class="note"><b>שאלות בשני שלבים:</b> האתר מציג רק את התוצאה של השאילתה הראשונה בחלון. הריצו את שלב 1, רשמו את המספרים, ואז הריצו את שלב 2.</div>
  </div>` });

Q.forEach((d, i) => {
  const n = i + 1;
  const chips = d.tables.map(t => `<span class="chip">${esc(t)}</span>`).join("");
  pages.push({ id: "q" + n, label: `שאלה ${n}`, n, html: `
    <div class="pg-head"><div class="eyebrow">${stageLabel(n)}</div><div class="pgno">שאלה ${n} מתוך ${Q.length}</div></div>
    <div class="qbody">
      <div class="qnum">${n}</div>
      <div class="qtext">${esc(d.q)}</div>
      <div class="meta">טבלאות: ${chips}</div>
      <button type="button" class="btn hint-btn" data-hint="${n}" aria-expanded="false">הצג רמז</button>
      <div class="hint" id="hint-${n}" hidden>${esc(d.hint)}</div>
    </div>` });
  pages.push({ id: "a" + n, label: `תשובה ${n}`, n, ans: true, html: `
    <div class="pg-head"><div class="eyebrow">תשובה לשאלה ${n} · ${STAGES[stageOf(n)].t}</div><div class="pgno">תשובה ${n} מתוך ${Q.length}</div></div>
    <div class="atitle">${esc(d.q)}</div>
    <div class="agrid">
      <div class="col">
        <div class="lbl">השאילתה</div>
        <pre class="sql"><code style="background:none;padding:0;font-size:inherit">${hl(d.sql)}</code></pre>
        ${d.pre ? `<div class="lbl">תוצאת שלב 1</div>${resultTable(d.pre)}<div class="lbl">תוצאת שלב 2</div>` : `<div class="lbl">התוצאה</div>`}
        ${resultTable(d)}
      </div>
      <div class="col">
        <div class="lbl">הסבר שלב אחר שלב</div>
        <ol class="steps">${d.steps.map(s => `<li><div>${s}</div></li>`).join("")}</ol>
        ${d.note ? `<div class="note">${d.note}</div>` : ""}
      </div>
    </div>` });
});

pages.forEach((p, i) => {
  const el = document.createElement("section");
  el.className = "pg" + (p.ans ? " ans" : "");
  el.id = "pg-" + p.id;
  el.setAttribute("aria-label", p.label);
  el.innerHTML = p.html;
  deck.appendChild(el);
  p.el = el;
});

// jump menu + progress
const jump = document.getElementById("jump");
jump.innerHTML = `<option value="0">פתיחה</option>` + Q.map((d, i) => `<option value="${1 + i * 2}">שאלה ${i + 1}</option>`).join("");
const prog = document.getElementById("progress");
prog.innerHTML = Q.map((_, i) => `<i data-i="${1 + i * 2}" title="שאלה ${i + 1}"></i>`).join("");

let cur = 0;
function show(i, scroll) {
  cur = Math.max(0, Math.min(pages.length - 1, i));
  pages.forEach((p, k) => p.el.classList.toggle("on", k === cur));
  const p = pages[cur];
  document.getElementById("where").textContent = p.n ? `${p.ans ? "תשובה" : "שאלה"} ${p.n} מתוך ${Q.length}` : "פתיחה";
  jump.value = p.n ? String(1 + (p.n - 1) * 2) : "0";
  [...prog.children].forEach((b, k) => { b.className = (p.n && k + 1 < p.n) ? "done" : (p.n === k + 1 ? "now" : ""); });
  document.getElementById("prev").disabled = cur === 0;
  const nx = document.getElementById("next");
  nx.disabled = cur === pages.length - 1;
  nx.textContent = p.n && !p.ans ? "לתשובה ←" : "הבא ←";
  if (document.body.classList.contains("doc")) { if (scroll) p.el.scrollIntoView({ block: "start" }); }
  else document.querySelector("main").scrollTop = 0;
}

function setView(v) {
  document.body.classList.toggle("slides", v === "slides");
  document.body.classList.toggle("doc", v === "doc");
  document.getElementById("v-slides").setAttribute("aria-pressed", v === "slides");
  document.getElementById("v-doc").setAttribute("aria-pressed", v === "doc");
  try { localStorage.setItem("sqlstats-view", v); } catch (e) {}
  show(cur, true);
}

document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("v-slides").onclick = () => setView("slides");
document.getElementById("v-doc").onclick = () => setView("doc");
jump.onchange = () => show(+jump.value, true);
prog.onclick = e => { const t = e.target.closest("i"); if (t) show(+t.dataset.i, true); };
deck.addEventListener("click", e => {
  const h = e.target.closest("[data-hint]");
  if (h) { const box = document.getElementById("hint-" + h.dataset.hint); box.hidden = !box.hidden; h.setAttribute("aria-expanded", !box.hidden); h.textContent = box.hidden ? "הצג רמז" : "הסתר רמז"; }
  const g = e.target.closest("[data-go]");
  if (g) show(pages.findIndex(p => p.id === g.dataset.go), true);
});
document.addEventListener("keydown", e => {
  if (document.body.classList.contains("doc")) return;
  if (e.target.closest("select")) return;
  if (e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (["ArrowLeft", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (["ArrowRight", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(pages.length - 1);
});

let view = "slides";
try { view = localStorage.getItem("sqlstats-view") || "slides"; } catch (e) {}
const start = pages.findIndex(p => p.id === location.hash.slice(1));
if (start > 0) cur = start;
setView(view === "doc" ? "doc" : "slides");
</script>
